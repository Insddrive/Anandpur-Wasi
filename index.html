<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ਸਿੱਖ ਇਤਿਹਾਸ ਗੈਲਰੀ</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #333; }
        
        /* ਮੀਨੂ ਡਿਜ਼ਾਈਨ */
        .menu { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .menu button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #2b579a; color: white; font-weight: bold; transition: 0.3s; }
        .menu button:hover { background: #1a3a6d; }
        
        /* ਗੈਲਰੀ ਡਿਜ਼ਾਈਨ */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .card h3 { font-size: 16px; margin: 5px 0 15px 0; color: #333; word-break: break-all; }
        
        /* ਬਟਨਾਂ ਦਾ ਡਿਜ਼ਾਈਨ */
        .action-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; }
        .btn { flex: 1; padding: 8px 5px; border: none; border-radius: 5px; cursor: pointer; text-align: center; text-decoration: none; font-size: 14px; font-weight: bold; color: white; }
        .open-btn { background: #28a745; }
        .open-btn:hover { background: #218838; }
        .dl-btn { background: #007bff; }
        .dl-btn:hover { background: #0069d9; }
    </style>
</head>
<body>

    <h1>ਸਿੱਖ ਇਤਿਹਾਸ ਗੈਲਰੀ</h1>
    
    <div id="menu" class="menu"></div>
    <div id="gallery" class="gallery"></div>

    <script>
        const user = "Insddrive"; // ਤੁਹਾਡਾ GitHub ਯੂਜ਼ਰਨੇਮ
        const repo = "Anandpur-Wasi"; // ਤੁਹਾਡੀ ਰੈਪੋ ਦਾ ਨਾਮ

        // ਫੋਲਡਰਾਂ ਦੀ ਲਿਸਟ
        const folders = ["June 1984", "ਖਾੜਕੂ ਲਹਿਰ", "Black Bite", "Black Lows", "Black orders", "Black Day", "ਗਦਾਰ", "Others"];

        const menuDiv = document.getElementById('menu');
        folders.forEach(folderName => {
            const btn = document.createElement('button');
            btn.innerText = folderName;
            btn.onclick = () => loadFiles(folderName);
            menuDiv.appendChild(btn);
        });

        async function loadFiles(folderName) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = "ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...";

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${encodeURIComponent(folderName)}`);
                const data = await response.json();
                
                gallery.innerHTML = "";
                if (!Array.isArray(data)) { gallery.innerText = "ਇਸ ਫੋਲਡਰ ਵਿੱਚ ਕੋਈ ਫਾਈਲ ਨਹੀਂ ਹੈ।"; return; }

                // ਨੰਬਰ ਵਾਈਜ਼ ਸੌਰਟਿੰਗ
                data.sort((a, b) => parseInt(a.name) - parseInt(b.name));

                data.forEach(file => {
                    if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // ਫੋਟੋ ਦਾ ਨਾਮ ਸਾਫ਼ ਕਰਨਾ (ਜਿਵੇਂ 1_Photo.jpg ਤੋਂ Photo)
                        let cleanName = file.name.replace(/^\d+[_]/, '').replace(/\.[^/.]+$/, "");
                        
                        // ਨਵੇਂ ਡਿਜ਼ਾਈਨ ਵਾਲਾ ਕਾਰਡ (Open ਅਤੇ Download ਬਟਨਾਂ ਸਮੇਤ)
                        card.innerHTML = `
                            <img src="${file.download_url}" alt="${cleanName}">
                            <h3>${cleanName}</h3>
                            <div class="action-buttons">
                                <a href="${file.download_url}" target="_blank" class="btn open-btn">ਖੋਲ੍ਹੋ</a>
                                <button onclick="downloadImage('${file.download_url}', '${file.name}')" class="btn dl-btn">ਡਾਊਨਲੋਡ</button>
                            </div>
                        `;
                        gallery.appendChild(card);
                    }
                });
            } catch (err) {
                gallery.innerText = "ਗਲਤੀ: ਫਾਈਲ ਲੋਡ ਨਹੀਂ ਹੋਈ।";
            }
        }

        // ਸਿੱਧਾ ਡਾਊਨਲੋਡ ਕਰਵਾਉਣ ਵਾਲਾ ਫੰਕਸ਼ਨ
        async function downloadImage(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                // ਜੇ ਕੋਈ ਐਰਰ ਆਵੇ ਤਾਂ ਫੋਟੋ ਨਵੇਂ ਟੈਬ ਵਿੱਚ ਖੋਲ੍ਹ ਦੇਵੇਗਾ
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
